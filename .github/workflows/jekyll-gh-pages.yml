# Legacy Jekyll deployment workflow retained for manual diagnostics only.
# The canonical GitHub Pages deployment is .github/workflows/static.yml.
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build with Jekyll (validation only)
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
