# Legacy Pages workflow retained for manual diagnostics only.
# The canonical GitHub Pages deployment is .github/workflows/static.yml.
name: Deploy OCODEJS docs to GitHub Pages (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate static site files
        run: |
          test -f index.html
          test -f studio.html
