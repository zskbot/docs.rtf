# Legacy Jekyll build retained for manual diagnostics only.
# The canonical GitHub Pages deployment is .github/workflows/static.yml.
name: Deploy Jekyll site to Pages (manual validation)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Ruby
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll (validation only)
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
