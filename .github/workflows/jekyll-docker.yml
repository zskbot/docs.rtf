name: Static site CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: static-site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate AI Studio source
        run: node tests/ai-studio-pages-smoke.mjs
      - name: Stage the public Pages artifact
        run: node scripts/prepare-site.mjs
      - name: Verify artifact contains only public entry points
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/studio.html
          test -s _site/404.html
          test -f _site/.nojekyll
          test ! -e _site/.github
          test ! -e _site/tests
          test ! -e _site/AI-STUDIO-IMPLEMENTATION.md
          test "$(find _site -type f | wc -l)" -eq 4
