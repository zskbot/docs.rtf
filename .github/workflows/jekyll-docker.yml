name: Static site CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: static-site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate static site entry points
        run: |
          set -euo pipefail
          test -s index.html
          test -s studio.html
          python3 - <<'PY'
          from pathlib import Path
          for name in ("index.html", "studio.html"):
              content = Path(name).read_text(encoding="utf-8")
              if "<html" not in content.lower():
                  raise SystemExit(f"{name}: missing HTML document root")
              if "</html>" not in content.lower():
                  raise SystemExit(f"{name}: missing closing HTML document tag")
              print(f"OK: {name}")
          PY
